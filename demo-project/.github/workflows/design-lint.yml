# Example workflow, for copying into your own repository.
#
# This file does NOT run here: GitHub only executes workflows from the repository
# root's .github/workflows. The one that actually exercises the action lives at
# <repo root>/.github/workflows/design-lint.yml.
#
# Copy this into your project as .github/workflows/design-lint.yml and pin the
# action to a released tag.

name: Design Lint

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write      # for the PR comment
  security-events: write    # for the SARIF upload

jobs:
  design-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Design Lint
        id: design-lint
        uses: Aaryansi/click-ship/packages/design-lint/action@master
        with:
          patterns: 'src/**/*.tsx'
          # set working-directory if your app is not at the repo root
          # working-directory: apps/web
          fail-on-error: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF
        if: steps.design-lint.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.design-lint.outputs.sarif }}
