name: 'Design Lint'
description: 'Design system enforcement for your codebase - ESLint for your design tokens'
author: 'Click-Ship'

branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  patterns:
    description: 'Comma-separated file patterns to lint'
    required: false
    default: 'src/**/*.{tsx,jsx,ts,js}'
  working-directory:
    description: 'Directory to lint from, for monorepos. Defaults to the workspace root.'
    required: false
    default: ''
  config:
    description: 'Path to a config file, relative to working-directory'
    required: false
    default: ''
  fail-on-error:
    description: 'Fail the action if errors are found'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for PR comments'
    required: false
    default: ''
  comment-on-pr:
    description: 'Comment results on the pull request'
    required: false
    default: 'true'
  baseline-file:
    description: 'Path to a baseline file, relative to working-directory. When present, only violations added after it was recorded are reported.'
    required: false
    default: '.design-lint-baseline.json'
  check-drift:
    description: 'Compare a committed Figma token export against the code tokens'
    required: false
    default: 'true'
  fail-on-drift:
    description: 'Fail the action when any token has drifted. Off by default: drift is usually not caused by the change under review.'
    required: false
    default: 'false'
  sarif-file:
    description: 'Where to write the SARIF report, relative to working-directory'
    required: false
    default: 'design-lint-results.sarif'

outputs:
  violations:
    description: 'Total number of violations found'
  errors:
    description: 'Number of errors found'
  warnings:
    description: 'Number of warnings found'
  files-scanned:
    description: 'Number of files linted'
  known:
    description: 'Violations already present in the baseline'
  fixed:
    description: 'Baselined violations no longer present'
  drifted:
    description: 'Tokens that disagree between Figma and the code'
  sarif:
    description: 'Path to the SARIF report'

runs:
  # node20 is deprecated on GitHub runners and was already being forced to node24,
  # see github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners
  using: 'node24'
  # bundled as CommonJS with an explicit .cjs extension. the package is
  # "type": "module", so a bundled dist/index.js would be loaded as ESM and any
  # require() the bundler emits would throw at startup
  main: 'dist/index.cjs'
